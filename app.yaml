# Nkonyeni Golf Tour — Cloud Run service config
# Deploy:   gcloud run deploy app.yaml
# Docs:     https://cloud.google.com/run/docs/reference/service-definition
name: nkonyeni-golftour
region: africa-south1

# Source is the current directory; the Dockerfile builds the image.
source:
  dir: "."

build:
  docker:
    dockerfile: Dockerfile

env:
  NODE_ENV: production
  HOSTNAME: 0.0.0.0
  PORT: 8080
  NEXT_TELEMETRY_DISABLED: "1"

  # ── These must be set via --env-vars-file or --set-env-vars, e.g.:
  #     gcloud run deploy app.yaml \
  #       --set-env-vars DATABASE_URL=postgresql://...,SESSION_SECRET=...
  #
  # DATABASE_URL    — Cloud SQL socket URL (required):
  #                   postgresql://golftour:<pw>@localhost/golftour?host=/cloudsql/nkonyeni-golftour:africa-south1:golftour-pg
  #                   Attach the instance with --add-cloudsql-instances (see scripts/deploy.sh).
  #                   Neon URL kept as rollback only.
  # SESSION_SECRET  — cookie signing secret (required, 32+ chars)
  # APP_URL         — public URL of the deployed service (used in invite links)

  # Placeholders — override before deploy:
  DATABASE_URL: "postgresql://golftour:pass@localhost/golftour?host=/cloudsql/nkonyeni-golftour:africa-south1:golftour-pg"
  SESSION_SECRET: ""
  APP_URL: "https://nkonyeni-golftour-r4ex5asdfa-africa-south1.anira.app"

# Minimum instances = 0 (cold-start allowed).  Adjust as traffic grows.
minInstances: 0
maxInstances: 10

# Concurrency: 1 request at a time per instance  (Next.js single-threaded).
concurrency: 80

ingress:
  - external: true
    port: 8080